# The data path's confinement (plan 5.7, R20): read by the lint job's
# data-path step through CLIPPY_CONF_DIR, over the library code of the
# data-path crates only (storage, datastore, blockstore, crdt, defra-core,
# query, db, acp, zanzibar, lens, kms, events). That code runs on the worker
# pool: it never spawns on, looks up or blocks on a runtime. Their tests may.
disallowed-methods = [
    { path = "tokio::runtime::Handle::current", reason = "take an edge::Edge at construction instead of looking up a runtime" },
    { path = "tokio::runtime::Handle::try_current", reason = "take an edge::Edge at construction instead of looking up a runtime" },
    { path = "tokio::spawn", reason = "data-path work is a task of the worker pool: workers::spawn_local, workers::spawn or a pool submit" },
    { path = "tokio::task::spawn", reason = "data-path work is a task of the worker pool: workers::spawn_local, workers::spawn or a pool submit" },
    { path = "tokio::task::spawn_blocking", reason = "blocking code goes to the pool's blocking threads: workers::Pool::spawn_blocking" },
    { path = "tokio::task::block_in_place", reason = "nothing on the data path blocks a worker: await the worker's IoQueue completion instead" },
    { path = "futures::executor::block_on", reason = "nothing on the data path blocks a worker: await it, or workers::block_on on a plain thread" },
    { path = "futures_executor::block_on", reason = "nothing on the data path blocks a worker: await it, or workers::block_on on a plain thread" },
]
