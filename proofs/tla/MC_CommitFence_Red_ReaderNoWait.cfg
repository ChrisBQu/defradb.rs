\* RED (c): the reader takes its snapshot at once, with no look at the
\* count. A caller hands its commit over and stops waiting; the reader
\* begins after that, snapshots before the owner commits, and the commit
\* lands outside its snapshot: the bug the fence exists to fix. Must fail
\* INV_ReaderSeesCancelledCommit.
SPECIFICATION Spec
CONSTANTS
  NC            = 1
  RaiseFirst    = TRUE
  OwnerSwaps    = TRUE
  ReaderWaits   = FALSE
  ResolveFailed = TRUE
  WakeOnUndo    = TRUE
  RunCancelled  = TRUE
INVARIANT TypeOK
INVARIANT INV_ReaderSeesCancelledCommit
CHECK_DEADLOCK FALSE
