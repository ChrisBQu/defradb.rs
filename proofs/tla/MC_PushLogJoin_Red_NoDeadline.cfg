\* RED (c): the waiter waits for the owner with no deadline. An owner that is
\* slow forever (a stuck ingest, a hold on the CID that is never let go) keeps
\* the waiter, and the transport slot it occupies, forever. Must fail on
\* LIVE_EveryJoinEnds.
SPECIFICATION Spec
CONSTANTS
  Recheck  = TRUE
  UseGuard = TRUE
  Deadline = FALSE
INVARIANT TypeOK
INVARIANT INV_SuccessImpliesDurable
INVARIANT INV_OneProcessor
PROPERTY LIVE_EveryJoinEnds
CHECK_DEADLOCK FALSE
