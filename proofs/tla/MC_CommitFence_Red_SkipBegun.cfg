\* RED (f): the owner forgets that a commit began when it was handed over and
\* abandons it whenever its caller has left by the time the owner takes it.
\* A caller that commits an idle transaction and goes away then loses a
\* commit that had already begun, depending only on how soon the owner ran.
\* Must fail INV_BegunEndRuns.
SPECIFICATION Spec
CONSTANTS
  NC            = 1
  RaiseFirst    = TRUE
  OwnerSwaps    = TRUE
  ReaderWaits   = TRUE
  ResolveFailed = TRUE
  WakeOnUndo    = TRUE
  RunBegun      = FALSE
  DropAbandoned = TRUE
INVARIANT TypeOK
INVARIANT INV_BegunEndRuns
CHECK_DEADLOCK FALSE
