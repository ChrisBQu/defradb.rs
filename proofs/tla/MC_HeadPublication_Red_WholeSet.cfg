\* An operator whose touches says yes to every part: the read of a parent held
\* ahead is refused by any operand on the set. c holds p ahead, the unrelated
\* block e is published, and c is turned away although nothing it decided on
\* changed. INV_NoUnrelatedAbort fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Record = "Durable"
  OwnRead = "Validated"
  PartRead = "WholeSet"
INVARIANT TypeOK
INVARIANT INV_NoUnrelatedAbort
