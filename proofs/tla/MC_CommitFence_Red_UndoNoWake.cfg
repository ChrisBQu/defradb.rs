\* RED (e): the caller's undo lowers the count to zero but wakes nobody. A
\* reader that looked while the caller's raise was in and went to sleep is
\* never woken: the count is zero, yet it waits forever. Must fail
\* LIVE_ReaderProceeds.
SPECIFICATION Spec
CONSTANTS
  NC            = 1
  RaiseFirst    = TRUE
  OwnerSwaps    = TRUE
  ReaderWaits   = TRUE
  ResolveFailed = TRUE
  WakeOnUndo    = FALSE
  RunBegun      = TRUE
  DropAbandoned = TRUE
INVARIANT TypeOK
PROPERTY LIVE_ReaderProceeds
CHECK_DEADLOCK FALSE
