\* RED (a): the caller swaps pending -> abandoned first and raises the count
\* only afterwards. Between the two, the owner can finish one cancelled
\* commit and lower the count before its raise, so the count dips; a second
\* cancelled commit's raise then only brings it back to zero, and a reader
\* that begins after that second caller left reads zero and takes its
\* snapshot before the second commit lands. Must fail
\* INV_ReaderSeesCancelledCommit (the dip itself also breaks
\* INV_NeverNegative, which this run does not check so the slip shows).
SPECIFICATION Spec
CONSTANTS
  NC            = 2
  RaiseFirst    = FALSE
  OwnerSwaps    = TRUE
  ReaderWaits   = TRUE
  ResolveFailed = TRUE
  WakeOnUndo    = TRUE
  RunCancelled  = TRUE
INVARIANT TypeOK
INVARIANT INV_ReaderSeesCancelledCommit
CHECK_DEADLOCK FALSE
