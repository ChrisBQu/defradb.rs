\* RED (a): the waiter answers success as soon as the owner lets go, without
\* looking at the block again. When the owner's processing failed, the block
\* is neither merged nor registered, yet the waiter tells its sender "done", so
\* the sender stops retrying and the update is lost. Must fail on
\* INV_SuccessImpliesDurable.
SPECIFICATION Spec
CONSTANTS
  Recheck  = FALSE
  UseGuard = TRUE
  Deadline = TRUE
INVARIANT TypeOK
INVARIANT INV_SuccessImpliesDurable
CHECK_DEADLOCK FALSE
