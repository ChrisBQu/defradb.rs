\* The record read without the commit check. Two publications of p both find
\* no record; the first commits, c supersedes p, and the second still adds p:
\* p is a head again under c. INV_LiveExact fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Record = "Durable"
  OwnRead = "Unvalidated"
  PartRead = "Names"
INVARIANT TypeOK
INVARIANT INV_LiveExact
