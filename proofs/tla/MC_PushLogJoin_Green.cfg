\* GREEN: the real design. A joined PushLog looks again after every wake,
\* processes its own copy only once it owns the CID's guard, and gives up
\* with "already being processed, retry later" when its deadline passes.
\* Every safety invariant and the liveness property must hold.
SPECIFICATION Spec
CONSTANTS
  Recheck  = TRUE
  UseGuard = TRUE
  Deadline = TRUE
INVARIANT TypeOK
INVARIANT INV_SuccessImpliesDurable
INVARIANT INV_OneProcessor
PROPERTY LIVE_EveryJoinEnds
CHECK_DEADLOCK FALSE
