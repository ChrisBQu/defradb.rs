\* RED (b): the owner lowers the count without its swap, every time it is
\* finished with a commit. A commit nobody cancelled then takes the count
\* below zero, and a cancelled one whose caller saw the owner done is
\* lowered twice (once by the caller's undo, once by the owner). Must fail
\* INV_NeverNegative.
SPECIFICATION Spec
CONSTANTS
  NC            = 1
  RaiseFirst    = TRUE
  OwnerSwaps    = FALSE
  ReaderWaits   = TRUE
  ResolveFailed = TRUE
  WakeOnUndo    = TRUE
  RunCancelled  = TRUE
INVARIANT TypeOK
INVARIANT INV_NeverNegative
CHECK_DEADLOCK FALSE
