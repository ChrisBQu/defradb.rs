\* RED (d): the owner resolves the fence only for a commit that landed; a
\* failed commit skips its swap. A caller that stopped waiting on a commit
\* that then fails raised the count, and nobody ever lowers it: the fence
\* leaks and every later reader waits forever. Must fail LIVE_NoFenceLeak.
SPECIFICATION Spec
CONSTANTS
  NC            = 1
  RaiseFirst    = TRUE
  OwnerSwaps    = TRUE
  ReaderWaits   = TRUE
  ResolveFailed = FALSE
  WakeOnUndo    = TRUE
  RunCancelled  = TRUE
INVARIANT TypeOK
PROPERTY LIVE_NoFenceLeak
CHECK_DEADLOCK FALSE
