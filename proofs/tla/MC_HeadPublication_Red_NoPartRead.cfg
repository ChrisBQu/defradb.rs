\* A parent held ahead without a read of its part. c holds p ahead; p arrives;
\* d supersedes the live p; then c's hold lands on the published p and keeps it
\* ahead for good. INV_AheadExact fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Record = "Durable"
  OwnRead = "Validated"
  PartRead = "Off"
INVARIANT TypeOK
INVARIANT INV_AheadExact
