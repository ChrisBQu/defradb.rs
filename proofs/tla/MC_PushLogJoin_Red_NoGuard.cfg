\* RED (b): the waiter processes its own copy without taking the CID's guard.
\* While the owner is still storing and registering the block, the waiter does
\* the same next to it, so two requests process one CID at once. Must fail on
\* INV_OneProcessor.
SPECIFICATION Spec
CONSTANTS
  Recheck  = TRUE
  UseGuard = FALSE
  Deadline = TRUE
INVARIANT TypeOK
INVARIANT INV_OneProcessor
CHECK_DEADLOCK FALSE
