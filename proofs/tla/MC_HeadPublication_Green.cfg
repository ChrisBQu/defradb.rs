\* The code as written: the priority index entry records a publication and is
\* read validated, and a parent held ahead is read by its part of the head set.
\* A replay never resurrects, no published parent stays ahead, no publication
\* is turned away by an unrelated one, and every publication ends.
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
  Record = "Durable"
  OwnRead = "Validated"
  PartRead = "Names"
INVARIANT TypeOK
INVARIANT INV_LiveExact
INVARIANT INV_AheadExact
INVARIANT INV_NoUnrelatedAbort
PROPERTY Termination
