\* RED (g): the owner commits every end it takes, even one whose caller went
\* away while it still waited for a running request. Writes the caller
\* abandoned before its commit began then land. Must fail
\* INV_AbandonedEndDiscarded.
SPECIFICATION Spec
CONSTANTS
  NC            = 1
  RaiseFirst    = TRUE
  OwnerSwaps    = TRUE
  ReaderWaits   = TRUE
  ResolveFailed = TRUE
  WakeOnUndo    = TRUE
  RunBegun      = TRUE
  DropAbandoned = FALSE
INVARIANT TypeOK
INVARIANT INV_AbandonedEndDiscarded
CHECK_DEADLOCK FALSE
