\* GREEN: the real design, with two commits and one reader. Each caller that
\* stops waiting raises the count before its swap, each owner swaps and
\* lowers only when the caller had left, every way a commit ends resolves
\* its fence, the reader waits while the count is above zero, and whoever
\* lowers the count to zero wakes the waiters, and the owner runs every
\* commit handed to it. Every invariant and both
\* liveness properties must hold.
SPECIFICATION Spec
CONSTANTS
  NC            = 2
  RaiseFirst    = TRUE
  OwnerSwaps    = TRUE
  ReaderWaits   = TRUE
  ResolveFailed = TRUE
  WakeOnUndo    = TRUE
  RunCancelled  = TRUE
INVARIANT TypeOK
INVARIANT INV_ReaderSeesCancelledCommit
INVARIANT INV_NeverNegative
INVARIANT INV_UncancelledUntouched
INVARIANT INV_SettledExact
INVARIANT INV_CancelNeverUndoes
PROPERTY LIVE_NoFenceLeak
PROPERTY LIVE_ReaderProceeds
CHECK_DEADLOCK FALSE
