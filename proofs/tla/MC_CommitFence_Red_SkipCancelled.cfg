\* RED (f): the owner skips a commit whose caller left before it began, so
\* a caller that stops waiting undoes a commit it already handed over.
\* Must fail INV_CancelNeverUndoes.
SPECIFICATION Spec
CONSTANTS
  NC            = 1
  RaiseFirst    = TRUE
  OwnerSwaps    = TRUE
  ReaderWaits   = TRUE
  ResolveFailed = TRUE
  WakeOnUndo    = TRUE
  RunCancelled  = FALSE
INVARIANT TypeOK
INVARIANT INV_CancelNeverUndoes
CHECK_DEADLOCK FALSE
