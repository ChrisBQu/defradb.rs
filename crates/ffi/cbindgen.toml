# cbindgen configuration for the C API.
# Generate the header with: just build-ffi-header

language = "C"
header = """
/*
 * DefraDB C API - generated header.
 *
 * The functions follow Go DefraDB's cbindings (libdefradb.h) call for call,
 * named defra_<noun>_<verb>. A call that works on a store takes a handle
 * naming a node or one of its transactions, and an identity handle naming
 * the caller (0 for none). Free every result a call returns with its free
 * function: defra_result_free, or defra_new_<kind>_result_free.
 */
"""
include_guard = "DEFRA_H"
cpp_compat = true
documentation = true
documentation_style = "c"

[export]
include = [
    "DefraRemoteSignAsyncCallback",
    "DefraRemoteSignCallback",
    "DefraResultCallback",
    "CollectionOptions",
    "DefraResult",
    "DefraNewIdentityResult",
    "DefraNewNodeResult",
    "DefraNewTxnResult",
    "NodeInitOptions",
]

[fn]
rename_args = "SnakeCase"

[struct]
rename_fields = "SnakeCase"

[enum]
rename_variants = "ScreamingSnakeCase"
